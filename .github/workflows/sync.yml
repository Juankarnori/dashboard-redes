name: sync-metrics

on:
  schedule:
    # Sync completo (posts, reels, audiencia): cada hora, para tener
    # métricas frescas sin pasarnos del tier gratis de GH Actions.
    - cron: "0 * * * *"
    # Historias: cada hora, porque expiran a las 24h y una corrida cada
    # 4h se las puede perder si se publican y borran entre medio.
    - cron: "15 * * * *"
    # Comentarios: cada 10 min (antes 30) — Composio no tiene Triggers/
    # webhooks para IG/FB/TikTok todavía (composio.triggers.listTypes
    # devuelve [] para las 3, verificado en vivo — Fase 3), así que la
    # bandeja de leads depende 100% de este polling. 10 min es el punto
    # dulce entre "casi en tiempo real" y el volumen de llamadas del
    # plan gratis de GitHub Actions (2000 min/mes): con N cuentas, este
    # cron solo son ~144 corridas/día — el costo real es N llamadas a
    # /api/sync por corrida, cada una barriendo el contenido de los
    # últimos COMMENTS_LOOKBACK_DAYS (14 días, ver comments-sync.ts).
    # Si hace falta más rápido, 5 min es el siguiente escalón razonable;
    # bajar de ahí empieza a competir en serio con el resto del tier
    # gratis (500 min por corrida de otros jobs, límite de la cuenta).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "all | stories | comments"
        default: "all"
        required: false

env:
  APP_URL: ${{ secrets.APP_URL }} # ej. https://tu-dominio.vercel.app
  SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar scope según el cron que disparó el job
        id: scope
        run: |
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "value=stories" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/10 * * * *" ]; then
            echo "value=comments" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.scope }}" ]; then
            echo "value=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Listar cuentas activas
        id: accounts
        run: |
          # Sin -f: queremos inspeccionar el body y el status a mano en
          # vez de dejar que curl aborte solo. Antes, una respuesta sin
          # la forma {accounts:[...]} (401 por secret mal puesto, HTML de
          # error, etc.) hacía que `jq '.accounts[].id'` tirara un error
          # de runtime al intentar iterar sobre algo que no es un arreglo
          # — con `set -eo pipefail` (default de los steps de GH Actions)
          # eso tumbaba el job entero con un críptico "exit code 5" en vez
          # de un mensaje claro. Ahora se valida cada paso por separado.
          set +e
          http_code=$(curl -s -o body.json -w "%{http_code}" \
            -H "Authorization: Bearer $SYNC_CRON_SECRET" \
            "$APP_URL/api/sync/accounts")
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl falló al llamar a /api/sync/accounts (exit $curl_exit) — revisá que APP_URL sea correcto y alcanzable."
            exit 1
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::/api/sync/accounts devolvió HTTP $http_code (revisá SYNC_CRON_SECRET/APP_URL en los secrets del repo). Body:"
            cat body.json
            exit 1
          fi
          if ! jq -e '.accounts' body.json > /dev/null 2>&1; then
            echo "::error::La respuesta de /api/sync/accounts no tiene la forma esperada {accounts:[...]}. Body:"
            cat body.json
            exit 1
          fi

          jq -c '.accounts[].id' body.json > account_ids.txt
          echo "Cuentas activas: $(wc -l < account_ids.txt)"
          cat account_ids.txt

      - name: Sincronizar cada cuenta (una llamada por cuenta)
        run: |
          scope="${{ steps.scope.outputs.value }}"
          while read -r id; do
            id=$(echo "$id" | tr -d '"')
            echo "Sync $id (scope=$scope)"
            curl -sf -X POST \
              -H "Authorization: Bearer $SYNC_CRON_SECRET" \
              "$APP_URL/api/sync?account_id=$id&scope=$scope" \
              || echo "::warning::Falló el sync de $id"
          done < account_ids.txt
