name: sync-metrics

on:
  schedule:
    # Sync completo (posts, reels, audiencia): cada hora, para tener
    # métricas frescas sin pasarnos del tier gratis de GH Actions.
    - cron: "0 * * * *"
    # Historias: cada hora, porque expiran a las 24h y una corrida cada
    # 4h se las puede perder si se publican y borran entre medio.
    - cron: "15 * * * *"
    # Comentarios: cada 30 min, para priorizar leads/quejas sin esperar
    # al sync completo.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "all | stories | comments"
        default: "all"
        required: false

env:
  APP_URL: ${{ secrets.APP_URL }} # ej. https://tu-dominio.vercel.app
  SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar scope según el cron que disparó el job
        id: scope
        run: |
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "value=stories" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/30 * * * *" ]; then
            echo "value=comments" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.scope }}" ]; then
            echo "value=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Listar cuentas activas
        id: accounts
        run: |
          response=$(curl -sf -H "Authorization: Bearer $SYNC_CRON_SECRET" \
            "$APP_URL/api/sync/accounts")
          echo "$response" | jq -c '.accounts[].id' > account_ids.txt
          cat account_ids.txt

      - name: Sincronizar cada cuenta (una llamada por cuenta)
        run: |
          scope="${{ steps.scope.outputs.value }}"
          while read -r id; do
            id=$(echo "$id" | tr -d '"')
            echo "Sync $id (scope=$scope)"
            curl -sf -X POST \
              -H "Authorization: Bearer $SYNC_CRON_SECRET" \
              "$APP_URL/api/sync?account_id=$id&scope=$scope" \
              || echo "::warning::Falló el sync de $id"
          done < account_ids.txt
